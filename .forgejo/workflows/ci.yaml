on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_x86_64:
        description: "Build x86_64 outputs"
        type: boolean
        default: true
      build_aarch64:
        description: "Build aarch64 outputs"
        type: boolean
        default: true
jobs:
  build-x86_64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_x86_64 }}
    runs-on: x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build and push x86_64 outputs
        run: om ci run .#default.x86_64 | xargs attic push cholli
      - name: Push x86_64 devShell environments
        run: |
          tmp=$(mktemp -d)
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          for shell in $(nix eval --raw ".#devShells.$system" --apply 's: builtins.concatStringsSep " " (builtins.attrNames s)'); do
            nix develop ".#$shell" --profile "$tmp/$shell" --command true
            attic push cholli "$(readlink -f "$tmp/$shell")"
          done
  build-aarch64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aarch64 }}
    runs-on: aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build and push aarch64 outputs
        continue-on-error: true
        run: om ci run .#default.aarch64 | xargs attic push cholli
      - name: Push aarch64 devShell environments
        continue-on-error: true
        run: |
          tmp=$(mktemp -d)
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          for shell in $(nix eval --raw ".#devShells.$system" --apply 's: builtins.concatStringsSep " " (builtins.attrNames s)'); do
            nix develop ".#$shell" --profile "$tmp/$shell" --command true
            attic push cholli "$(readlink -f "$tmp/$shell")"
          done
  promote:
    needs: [build-x86_64, build-aarch64]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: x86_64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Merge last successful commit into main
        run: |
          git config user.email "forgejo-actions[bot]@christophhollizeck.dev"
          git config user.name "forgejo-actions[bot]"
          git checkout main
          git merge --no-ff -m "promote ${{ github.sha }}" ${{ github.sha }}
          git push origin main
